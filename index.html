<!doctype html><html lang=vi><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Caro Arena • 01</title><style>*{box-sizing:border-box}body{margin:0;background:#080e19;color:#f6e7c7;font:15px system-ui}main{max-width:560px;margin:auto;padding:14px}header{letter-spacing:4px;text-align:center;color:#e8bc72;font-size:24px;font-weight:800}small{color:#9aafc1}#scene{height:190px;border:1px solid #80613c;border-radius:18px;overflow:hidden;background:radial-gradient(ellipse at top,#38516a,#101c30 65%)}#scene canvas{width:100%;height:100%}.panel{background:#142032;border:1px solid #33435a;border-radius:14px;padding:12px;margin:10px 0}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.red{color:#ff917f}.blue{color:#8ad9ff}#board{width:100%;display:block;touch-action:manipulation;border-radius:12px;box-shadow:0 8px 25px #0009}button,select,input{background:#23354a;color:#f6e7c7;border:1px solid #52627a;border-radius:9px;padding:10px;font:inherit;max-width:100%}button{cursor:pointer}#status{text-align:center;font-weight:bold;margin:12px}#talk{min-height:68px;line-height:1.5}#event{color:#e8bc72}label{font-size:12px;color:#a9bed0}h3{margin:0 0 8px}input{width:75px}</style><main><header>CARO ARENA</header><center><small>ĐẤU TRƯỜNG • BẢN 01</small></center><div id=scene><div id=fallback style="padding:50px;text-align:center">Đấu trường đang tải…</div></div><div class="panel row"><b class=red>THIÊN LONG <span id=s1>0</span></b><b class=blue><span id=s2>0</span> NGUYỆT LINH</b></div><div class=panel id=talk><div class=red id=t1>Đến đây, thử tài nào!</div><div class=blue id=t2>Đừng vội khoe nhé.</div></div><div id=status></div><canvas id=board width=750 height=750></canvas><div class="panel row"><input id=coord placeholder=F7><button id=play>Đánh</button><button id=reset>Ván mới</button><button id=voice>🔊 Bật thoại</button></div><div class="panel row"><select id=mode><option value=ai>Đấu AI</option><option value=two>Hai người</option></select><select id=first><option value=1>Người đi trước</option><option value=2>AI đi trước</option></select></div><div class=panel><h3>Giải đấu hằng ngày</h3><div id=event></div><small>09:00 · 12:00 · 18:00 · 20:00 · 22:00 (VN). Lịch hiển thị tại máy, chưa có ghép cặp online.</small></div><div class=panel><label>Giọng nam</label><select id=male></select><label>Giọng nữ</label><select id=female></select><small id=voiceinfo></small></div></main><script src=engine.js></script><script src=game.js></script><script type=module src=scene.js></script></html>
